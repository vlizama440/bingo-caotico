<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17152c"><title>Bingo</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#17152c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0,#443176 0,transparent 48%),#17152c}main{max-width:1100px;margin:auto;padding:22px 16px 72px}h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.06em;margin:8px 0 14px}h2{font-size:clamp(21px,4vw,29px);margin:0 0 14px}p{color:#d2cce7;line-height:1.5}.eyebrow{font-weight:850;letter-spacing:.19em;color:#ffc964;font-size:12px}.panel{background:#ffffff10;border:1px solid #ffffff25;border-radius:22px;padding:clamp(16px,3vw,24px);margin:14px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.row.tight>*{flex:initial}button,input,select{font:inherit;border:0;border-radius:12px;padding:13px 14px}input{background:#fff;color:#17152c;width:100%;margin:7px 0 12px;font-size:18px}button{font-weight:850;background:#ffca57;color:#1a1630;cursor:pointer}button:disabled{opacity:.45;cursor:default}.alt{background:#786cda;color:#fff}.danger{background:#eb6072;color:white}.outline{border:1px solid #ffffff4a;color:white;background:#ffffff15}.mini{font-size:13px;padding:9px 12px}.tiny{font-size:13px;color:#d3cce6}.big{font-size:clamp(55px,12vw,112px);font-weight:950;letter-spacing:-.075em;margin:4px 0;color:#ffd16c}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:#ffffff19;padding:10px 14px;border-radius:14px;font-size:12px}.stat b{font-size:22px;display:block}.ball{width:49px;height:49px;border-radius:50%;background:#ffcf57;color:#1c1540;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;box-shadow:inset -6px -7px #0002;margin:3px}.carton{max-width:510px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;--card-base:#6d55d8;--card-tint:#f0ebff}.cell{aspect-ratio:1;min-width:0;border-radius:11px;background:var(--card-tint);color:#29203d;display:flex;justify-content:center;align-items:center;font-size:clamp(20px,5.5vw,32px);font-weight:900;padding:0;position:relative;overflow:hidden;border:1px solid #1c173015}.cell.marked::after{content:'';position:absolute;width:68%;height:68%;border-radius:50%;background:radial-gradient(circle at 28% 22%,#c79560,#75401f 72%);box-shadow:inset -5px -5px 8px #391b1480,2px 3px 4px #150d2c70;transform:rotate(-24deg)}.carton[data-chip=lentil] .cell.marked::after{width:75%;height:57%;background:radial-gradient(ellipse at 30% 28%,#ddb77b,#86653b 78%);transform:rotate(23deg)}.carton[data-chip=blue] .cell.marked::after{width:78%;height:78%;background:radial-gradient(circle at 25% 20%,#b0eaffb5,#248dd2a6 58%,#0965b8c0);box-shadow:inset -4px -5px 7px #08469a77,0 2px 5px #0a369a55;border:2px solid #abdfff99}.cell.marked .value{position:relative;z-index:1;color:#fff;text-shadow:0 1px 3px #21102c,0 1px 6px #21102c}.cell.free{background:var(--card-base);color:white}.heading{background:var(--card-base);color:white;text-align:center;font-weight:950;border-radius:10px;font-size:24px;padding:8px}.carton[data-color=blue]{--card-base:#1968bc;--card-tint:#e4f2ff}.carton[data-color=rose]{--card-base:#b53a79;--card-tint:#ffe8f1}.carton[data-color=green]{--card-base:#157a65;--card-tint:#e0fff3}.carton[data-color=orange]{--card-base:#cd6e20;--card-tint:#fff0d9}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ea6178;color:white;padding:14px 22px;border-radius:15px;max-width:90%;z-index:25;font-weight:800}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}.log{max-height:280px;overflow:auto}.log p{padding:8px 0;border-bottom:1px solid #ffffff23;margin:0}.host-link{word-break:break-all;font-size:14px;color:#ffc64d}#qr{background:white;padding:12px;border-radius:14px;display:inline-flex}.announce{font-weight:950;color:#70efbd;font-size:clamp(22px,5vw,36px)}.feature{background:#271f48;border-radius:20px;padding:20px;text-align:center}.number-grid{display:flex;flex-wrap:wrap;gap:2px;align-items:center}.player-row{display:flex;gap:9px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff24;flex-wrap:wrap}.player-row .who{flex:1;min-width:110px}.player-row .who small{display:block;color:#c9c0e5}.player-row .actions{display:flex;gap:6px;flex-wrap:wrap}.player-row .actions button{font-size:12px;padding:8px 10px}.colors,.chips{display:flex;gap:7px;flex-wrap:wrap}.swatch{padding:0;width:39px;height:39px;border-radius:50%;border:3px solid #ffffff50}.swatch.selected{outline:3px solid #fff;outline-offset:2px}.chip-opt{border:1px solid #ffffff38;background:#ffffff12;color:#fff;padding:10px 12px}.chip-opt.selected{background:#7764d4;border-color:#fff}.check-output{background:#201c3d;border:1px solid #ffffff4a;border-radius:15px;padding:14px;margin-top:14px}.spin{animation:pulse .2s infinite alternate}@keyframes pulse{to{transform:scale(1.05);filter:brightness(1.23)}}.top-rule{margin-top:0}.muted{opacity:.7}@media(max-width:560px){.cell{border-radius:8px}.panel{border-radius:17px}.player-row .actions{width:100%}.player-row .actions button{flex:1}}
</style></head><body><main><div class="eyebrow">🎉 MULTIJUGADOR EN VIVO</div><h1>BINGO</h1><div id="app"></div></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>
const app=document.getElementById('app');let socket,state=null,role='',room='',token='',alertTimer,checkResult=null,spinTimer=null,spinValue=null;const qs=new URLSearchParams(location.search);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(x){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=x;document.body.append(el);clearTimeout(alertTimer);alertTimer=setTimeout(()=>el.remove(),3700)}
function connect(){const proto=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(proto+'//'+location.host);socket.onopen=()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem('bc-session')||'null')}catch(e){}if(saved?.room&&saved?.token)send({type:saved.role==='host'?'resumeHost':'resume',room:saved.room,token:saved.token});else render();};socket.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='error'){notify(d.message);if(d.message.includes('recuperar'))clearSession();return}if(d.type==='created'||d.type==='joined'){room=d.room;token=d.token;role=d.type==='created'?'host':'player';localStorage.setItem('bc-session',JSON.stringify({room,token,role}));history.replaceState(null,'',role==='player'?'?sala='+room:'?anfitrion='+room)}if(d.type==='checkResult'){checkResult=d;render();return}if(d.type==='state'){const wasSpinning=state?.spinning;state=d;role=d.role;room=d.room;if(d.spinning&&!wasSpinning)beginSpin();if(!d.spinning&&wasSpinning)endSpin();render()}};socket.onclose=()=>{clearInterval(spinTimer);notify('Reconectando…');setTimeout(connect,1800)}}
function send(x){if(socket?.readyState===1)socket.send(JSON.stringify(x));else notify('Conectando…')}
function clearSession(){localStorage.removeItem('bc-session');state=null;role='';room='';token='';history.replaceState(null,'',location.pathname);render()}
function beginSpin(){clearInterval(spinTimer);spinValue=cryptoRandom();spinTimer=setInterval(()=>{spinValue=cryptoRandom();const target=document.querySelector('[data-draw-number]');if(target)target.textContent=letter(spinValue)+' '+spinValue;},75)}
function endSpin(){clearInterval(spinTimer);spinTimer=null;spinValue=null;}
function cryptoRandom(){return Math.floor(Math.random()*75)+1}function letter(n){return 'BINGO'[Math.floor((n-1)/15)]}
function intro(){return `<div class="panel"><h2>Entrar a una partida</h2><form id="join"><label>Tu nombre<input id="name" maxlength="24" placeholder="Ej. Camila" required></label><label>Código de sala<input id="room" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" value="${escapeHtml(qs.get('sala')||'')}" placeholder="123" required></label><button style="width:100%">Entrar al bingo</button></form></div><div class="panel"><h2>¿Eres el animador?</h2><p>Crea una sala, muestra el QR y controla el sorteo desde tu computador.</p><button class="alt" id="create">Crear sala</button></div>`}
function summary(){return `<div class="stats"><div class="stat"><b>${state.players}/${state.maxPlayers}</b>Jugadores</div><div class="stat"><b>${state.drawn.length}/75</b>Números sorteados</div><div class="stat"><b>${state.winners.filter(x=>x.kind==='line').reduce((n,w)=>n+(w.count||1),0)}</b>Líneas logradas</div></div>`}
function playerSummary(){return `<div class="stats"><div class="stat"><b>${state.players}/${state.maxPlayers}</b>Jugadores</div><div class="stat"><b>${state.lines}</b>Mis líneas</div></div>`}
function winners(){if(!state.winners.length)return '<p>Todavía no hay premios.</p>';return `<div class="log">${[...state.winners].reverse().map(w=>`<p>${w.kind==='bingo'?'🏆 ¡BINGO!':'✨ Línea'} — <strong>${escapeHtml(w.name)}</strong> · sorteo #${w.draw}</p>`).join('')}</div>`}
function recentNumbers(){return `<div class="panel"><h2>Números sorteados</h2>${state.drawn.length?`<div class="number-grid">${[...state.drawn].reverse().map(n=>`<span class="ball" title="${letter(n)} ${n}">${n}</span>`).join('')}</div>`:'<p>Aún no hay números.</p>'}</div>`}
function resultBox(){if(!checkResult)return '';const d=checkResult;return `<div class="check-output" role="status"><strong>${d.valid?'✅ VÁLIDO':'❌ INCOMPLETO'} — ${escapeHtml(d.name)}</strong><p>${d.kind==='line'?'Comprobar línea':'Comprobar cartón'}: ${d.valid?(d.kind==='line'?`${d.completed} línea(s) válida(s)`:'cartón completo, todos los números marcados y sorteados'):`faltan ${d.missingCount} número(s) por marcar o por salir${d.missing.length?': '+d.missing.join(', '):''}`}</p><button class="outline mini" id="closeCheck">Cerrar resultado</button></div>`}
function host(){const url=location.origin+location.pathname+'?sala='+room;const display=state.spinning?letter(spinValue||1)+' '+(spinValue||1):state.last===null?'—':letter(state.last)+' '+state.last;return `<div class="grid2"><div><div class="panel"><div class="tiny">ÚLTIMO NÚMERO</div><div class="big ${state.spinning?'spin':''}" data-draw-number>${display}</div><button style="width:100%" id="draw" ${!state.spinning&&(!state.started||state.gameOver||state.drawn.length===75)?'disabled':''}>${state.spinning?'⏹ Parar':'🎱 Sacar siguiente número'}</button>${state.gameOver?'<p class="announce">🏆 ¡TENEMOS BINGO!</p>':''}${!state.started?'<p class="tiny">Comienza la partida cuando todos hayan ingresado.</p>':''}</div>${recentNumbers()}</div><div><div class="panel"><h2>Sala <span style="color:#ffc964;font-size:1.5em">${room}</span></h2><p>Que todos entren escaneando el QR o usando el código.</p><div id="qr"></div><p class="host-link">${escapeHtml(url)}</p><button class="alt mini" id="copy">Copiar enlace</button>${!state.started?'<p><button style="width:100%" id="start" '+(!state.players?'disabled':'')+'>Comenzar partida</button></p>':'<p class="tiny">Partida en curso</p>'}</div>${summary()}<div class="panel"><button class="danger mini" id="reset">Nueva partida</button></div></div></div><div class="grid2"><div class="panel"><h2>Jugadores</h2>${state.members.length?`<div class="log">${state.members.map(p=>`<div class="player-row"><div class="who">${p.connected?'🟢':'⚪'} <strong>${escapeHtml(p.name)}</strong>${p.bingo?' 🏆':''}<small>${p.lines} líneas · ${p.connected?'En línea':'Desconectado'}</small></div><div class="actions"><button class="outline" data-check="line" data-id="${p.id}">Comprobar línea</button><button class="outline" data-check="card" data-id="${p.id}">Comprobar cartón</button></div></div>`).join('')}</div>`:'<p>Esperando jugadores…</p>'}${resultBox()}</div><div class="panel"><h2>Premios</h2>${winners()}</div></div>`}
function styleOptions(){const colors=[['violet','#806de6','Morado'],['blue','#2678d1','Azul'],['rose','#c84583','Rosa'],['green','#1a9478','Verde'],['orange','#dd8336','Naranja']];return `<div class="panel"><h2>Personaliza tu cartón</h2><p class="tiny">Puedes cambiarlo hasta que empiece la partida.</p><p>Color del cartón</p><div class="colors">${colors.map(c=>`<button class="swatch ${state.color===c[0]?'selected':''}" style="background:${c[1]}" data-color="${c[0]}" aria-label="${c[2]}" title="${c[2]}"></button>`).join('')}</div><p>Ficha para marcar</p><div class="chips">${[['bean','🫘 Poroto'],['lentil','🟤 Lenteja'],['blue','🔵 Ficha']].map(c=>`<button class="chip-opt ${state.chip===c[0]?'selected':''}" data-chip="${c[0]}">${c[1]}</button>`).join('')}</div></div>`}
function player(){const display=state.spinning?letter(spinValue||1)+' '+(spinValue||1):state.last===null?'—':letter(state.last)+' '+state.last;return `<div class="panel" style="text-align:center"><div class="tiny">${escapeHtml(state.name)} · SALA ${room}</div><h2 style="font-size:36px;color:#ffce60;margin:7px 0">¡BINGO!</h2><p class="top-rule">${!state.started?'Esperando al animador…':'Marca tú mismo los números que vayan saliendo.'}</p><div class="carton" data-color="${state.color}" data-chip="${state.chip}">${'BINGO'.split('').map(l=>`<div class="heading">${l}</div>`).join('')}${state.card.map((n,i)=>`<button class="cell ${n===0?'free':state.marked.includes(i)?'marked':''}" data-cell="${i}" ${!state.started||state.gameOver||n===0?'disabled':''}><span class="value">${n===0?'★':n}</span></button>`).join('')}</div><p class="tiny">${state.started?'Puedes marcar cualquier casilla. Solo cuentan para ganar los números que realmente salieron.':'El centro es libre. Cuando comience la partida, toca tus números para poner una ficha.'}</p>${!state.started?'<button class="alt" id="shuffle">🔀 Generar otro cartón</button>':''}</div>${!state.started?styleOptions():''}<div class="panel"><div class="tiny">ÚLTIMO NÚMERO</div><div class="big ${state.spinning?'spin':''}" data-draw-number>${display}</div>${summary()}</div><div class="panel"><h2>Mis premios</h2>${state.lines?`<p>✨ ${state.lines} línea(s) válidas</p>`:'<p>Aún no tienes una línea válida.</p>'}${state.bingo?'<p class="announce">🏆 ¡Cartón completo!</p>':''}</div><div class="panel"><h2>Ganadores</h2>${winners()}</div>`}
function render(){app.innerHTML=state?(role==='host'?host():player()):intro();const el=id=>document.getElementById(id);if(el('join'))el('join').onsubmit=e=>{e.preventDefault();send({type:'join',name:el('name').value,room:el('room').value})};if(el('create'))el('create').onclick=()=>send({type:'create'});if(el('start'))el('start').onclick=()=>send({type:'start'});if(el('draw'))el('draw').onclick=()=>send({type:state.spinning?'stop':'draw'});if(el('shuffle'))el('shuffle').onclick=()=>send({type:'shuffle'});if(el('reset'))el('reset').onclick=()=>{if(confirm('¿Nueva partida? Se reinician los cartones y los premios.'))send({type:'reset'})};if(el('closeCheck'))el('closeCheck').onclick=()=>{checkResult=null;render()};if(el('copy'))el('copy').onclick=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?sala='+room).then(()=>notify('Enlace copiado')).catch(()=>notify('Copia el enlace que aparece arriba'));document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>send({type:'mark',index:Number(b.dataset.cell)}));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{if(!state.started)send({type:'style',color:b.dataset.color})});document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{if(!state.started)send({type:'style',chip:b.dataset.chip})});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>send({type:'check',kind:b.dataset.check,playerId:b.dataset.id}));const qr=el('qr');if(qr&&window.QRCode)QRCode.toCanvas(location.origin+location.pathname+'?sala='+room,{width:175,margin:1},(err,canvas)=>{if(!err&&qr.isConnected)qr.replaceChildren(canvas)});else if(qr)qr.textContent='Comparte el enlace.'}
render();connect();
</script></body></html>
