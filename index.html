<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17152c"><title>Bingo Caótico 🎱</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#17152c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0,#433177 0,transparent 45%),#17152c}main{max-width:940px;margin:auto;padding:28px 18px 80px}h1{font-size:clamp(38px,7vw,72px);letter-spacing:-.06em;margin:12px 0}h2{font-size:clamp(24px,5vw,34px);margin:0 0 14px}p{color:#d2cce7;line-height:1.5}.eyebrow{font-weight:900;letter-spacing:.2em;color:#ffc964}.panel{background:#ffffff10;border:1px solid #ffffff27;border-radius:22px;padding:25px;margin:20px 0;backdrop-filter:blur(6px)}button,input{font:inherit;border:0;border-radius:14px;padding:15px 18px}input{background:white;color:#17152c;width:100%;margin:7px 0 12px;font-size:18px}button{font-weight:850;background:#ffc64d;color:#19152e;cursor:pointer}button:disabled{opacity:.4;cursor:default}.alt{background:#766ad3;color:white}.danger{background:#eb6072;color:white}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1}.tiny{font-size:13px;color:#d3cce6}.big{font-size:clamp(55px,15vw,128px);font-weight:950;letter-spacing:-.08em;margin:8px 0;color:#ffd16c}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#ffffff19;padding:12px 18px;border-radius:14px}.stat b{font-size:24px;display:block}.ball{width:68px;height:68px;border-radius:50%;background:#ffce53;color:#1c1540;display:inline-flex;align-items:center;justify-content:center;font-weight:950;font-size:24px;box-shadow:inset -7px -10px #0002;margin:4px}.carton{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.cell{aspect-ratio:1;min-width:0;border-radius:12px;background:#f6f2ff;color:#29203d;display:flex;justify-content:center;align-items:center;font-size:clamp(19px,5vw,33px);font-weight:900;padding:0;position:relative}.cell.marked{background:#56e2ad;color:#103a34}.cell.available{outline:3px solid #ffd16c;outline-offset:-3px}.cell.free{background:#806de6;color:white}.heading{background:#806de6;color:white;text-align:center;font-weight:1000;border-radius:10px;font-size:26px;padding:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff657a;color:white;padding:14px 22px;border-radius:15px;max-width:90%;z-index:20;font-weight:800}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.log{max-height:240px;overflow:auto}.log p{padding:7px 0;border-bottom:1px solid #ffffff25;margin:0}.muted{opacity:.65}.host-link{word-break:break-all;font-size:14px;color:#ffc64d}#qr{background:white;padding:12px;border-radius:14px;display:inline-flex}.hidden{display:none}small{color:#d5cfe8}.announce{font-weight:950;color:#70efbd;font-size:clamp(22px,5vw,42px)}
</style></head><body><main><div class="eyebrow">🎉 MULTIJUGADOR EN VIVO</div><h1>BINGO <span style="color:#ffca55">CAÓTICO</span></h1><div id="app"></div></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>
const app=document.getElementById('app');let socket,state=null,role='',room='',token='',message='';const qs=new URLSearchParams(location.search);let alertTimer;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(x){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=x;document.body.append(el);clearTimeout(alertTimer);alertTimer=setTimeout(()=>el.remove(),3600)}
function connect(){const proto=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(proto+'//'+location.host);socket.onopen=()=>{const saved=JSON.parse(localStorage.getItem('bc-session')||'null');if(saved?.room&&saved?.token){if(saved.role==='host')send({type:'resumeHost',room:saved.room,token:saved.token});else send({type:'resume',room:saved.room,token:saved.token});}else render();};socket.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error'){notify(d.message);if(d.message.includes('recuperar')){localStorage.removeItem('bc-session');role='';state=null;render();}return}if(d.type==='created'||d.type==='joined'){room=d.room;token=d.token;role=d.type==='created'?'host':'player';localStorage.setItem('bc-session',JSON.stringify({room,token,role}));history.replaceState(null,'',role==='player'?'?sala='+room:'?anfitrion='+room)}if(d.type==='state'){state=d;role=d.role;room=d.room;render()}};socket.onclose=()=>{notify('Conexión interrumpida. Intentando reconectar…');setTimeout(connect,1500)}}
function send(x){if(socket?.readyState===1)socket.send(JSON.stringify(x));else notify('Conectando…')}
function clearSession(){localStorage.removeItem('bc-session');state=null;role='';room='';token='';history.replaceState(null,'',location.pathname);render()}
function intro(){const pre=qs.get('sala')||'';return `<div class="panel"><h2>Entrar a una partida</h2><form id="join"><label>Tu nombre<input id="name" maxlength="24" placeholder="Ej. Camila" required></label><label>Código de sala<input id="room" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" value="${escapeHtml(pre)}" placeholder="123456" required></label><button style="width:100%">Entrar al bingo</button></form></div><div class="panel"><h2>¿Eres el animador?</h2><p>Crea una sala y controla el sorteo en vivo desde tu computador.</p><button class="alt" id="create">Crear una sala</button></div>`}
function summary(){return `<div class="stats"><div class="stat"><b>${state.players}/40</b>Jugadores</div><div class="stat"><b>${state.drawn.length}/75</b>Números sorteados</div><div class="stat"><b>${state.winners.filter(x=>x.kind==='line').length}</b>Líneas completadas</div></div>`}
function winners(){if(!state.winners.length)return '<p>Todavía no hay premios.</p>';return `<div class="log">${[...state.winners].reverse().map(w=>`<p> ${w.kind==='bingo'?'🏆 ¡BINGO!':'✨ Línea'} — <strong>${escapeHtml(w.name)}</strong> · sorteo #${w.draw}</p>`).join('')}</div>`}
function host(){const url=location.origin+location.pathname+'?sala='+room;return `${summary()}<div class="grid2"><div class="panel"><h2>Sala ${room}</h2><p>Que todos entren escaneando el QR o usando el código.</p><div id="qr"></div><p class="host-link">${escapeHtml(url)}</p><button class="alt" id="copy">Copiar enlace</button></div><div class="panel"><h2>Panel del animador</h2>${!state.started?`<p>Cuando estén todos, inicia la partida.</p><button id="start" ${state.players===0?'disabled':''}>Comenzar partida</button>`:`<div class="tiny">ÚLTIMO NÚMERO</div><div class="big">${state.last===null?'—':letter(state.last)+' '+state.last}</div><button id="draw" ${state.gameOver||state.drawn.length===75?'disabled':''}>🎱 Sacar siguiente número</button>${state.gameOver?'<p class="announce">¡Tenemos BINGO!</p>':''}`}<p><button class="danger" id="reset">Nueva partida</button></p></div></div><div class="grid2"><div class="panel"><h2>Jugadores</h2><div class="log">${state.members.length?state.members.map(p=>`<p>${p.connected?'🟢':'⚪'} ${escapeHtml(p.name)} ${p.bingo?'🏆':''}</p>`).join(''):'<p>Esperando jugadores…</p>'}</div></div><div class="panel"><h2>Premios</h2>${winners()}</div></div><div class="panel"><h2>Números sorteados</h2>${state.drawn.length?state.drawn.map(n=>`<span class="ball">${n}</span>`).join(''):'<p>Aún no hay números.</p>'}</div>`}
function letter(n){return 'BINGO'[Math.floor((n-1)/15)]}
function player(){return `${summary()}<div class="panel" style="text-align:center"><div class="tiny">${escapeHtml(state.name)} · SALA ${room}</div>${!state.started?'<h2>¡Ya estás dentro!</h2><p>Esperando a que el animador inicie la partida…</p>':`<div class="tiny">ÚLTIMO NÚMERO</div><div class="big">${state.last===null?'—':letter(state.last)+' '+state.last}</div>`}${state.gameOver?'<div class="announce">🏆 ¡BINGO!</div>':''}</div><div class="panel"><h2>Tu cartón</h2><p>Marca solamente los números que ya salieron. El centro es libre.</p><div class="carton">${'BINGO'.split('').map(l=>`<div class="heading">${l}</div>`).join('')}${state.card.map((n,i)=>`<button class="cell ${n===0?'free':state.marked.includes(i)?'marked':state.drawn.includes(n)?'available':''}" data-cell="${i}" ${!state.started||state.gameOver||n===0||!state.drawn.includes(n)?'disabled':''}>${n===0?'★':n}</button>`).join('')}</div><p class="tiny">Verde: marcado · Borde amarillo: puedes marcarlo</p></div><div class="panel"><h2>Premios conseguidos</h2>${state.lines?`<p>✨ ${state.lines} línea(s) completada(s)</p>`:'<p>Todavía no tienes una línea.</p>'}${state.bingo?'<p>🏆 ¡Cartón completo!</p>':''}</div><div class="panel"><h2>Ganadores de la sala</h2>${winners()}</div>`}
function render(){app.innerHTML=state?(role==='host'?host():player()):intro();const form=document.getElementById('join');if(form)form.onsubmit=e=>{e.preventDefault();send({type:'join',name:document.getElementById('name').value,room:document.getElementById('room').value})};const create=document.getElementById('create');if(create)create.onclick=()=>send({type:'create'});const start=document.getElementById('start');if(start)start.onclick=()=>send({type:'start'});const draw=document.getElementById('draw');if(draw)draw.onclick=()=>send({type:'draw'});const reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('¿Crear una nueva partida? Se reinician cartones y premios.'))send({type:'reset'})};const copy=document.getElementById('copy');if(copy)copy.onclick=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?sala='+room).then(()=>notify('Enlace copiado'));document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>send({type:'mark',index:Number(b.dataset.cell)}));const qr=document.getElementById('qr');if(qr&&window.QRCode){QRCode.toCanvas(location.origin+location.pathname+'?sala='+room,{width:180,margin:1},(err,canvas)=>{if(!err && qr.isConnected)qr.replaceChildren(canvas)})}else if(qr){qr.textContent='Comparte el enlace de arriba.'}}
render();connect();
</script></body></html>
